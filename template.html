<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout concept: a ledger. A narrow contents rail on the left, a reading column on
   the right, wide figures that break out of the column, and event codes in monospace
   like entries in an audit log. Severity colors (info, warning, critical) are the
   product's own, reused here as the only loud colors. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #E9EEF5;
  --ink: #0F1B2D;
  --muted: #53627C;
  --line: #D5DCE7;
  --line-strong: #AEBBCE;
  --accent: #0B6E6E;
  --accent-soft: #D9EFED;
  --info: #2456C9;
  --info-soft: #E1EAFB;
  --warn: #A8530A;
  --warn-soft: #FBEBD6;
  --crit: #B3261E;
  --crit-soft: #FADDDA;
  --ok: #1B7F4B;
  --ok-soft: #DDF3E6;
  --code-bg: #0E1726;
  --code-fg: #DCE6F5;
  --code-muted: #8294B1;
  --add-bg: rgba(54, 179, 126, 0.20);
  --del-bg: rgba(240, 90, 80, 0.22);
  --font-display: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A111F;
    --surface: #111B2E;
    --surface-2: #18243B;
    --ink: #E7EDF7;
    --muted: #9BABC6;
    --line: #24334D;
    --line-strong: #3C4F70;
    --accent: #46C2B8;
    --accent-soft: #0F2E30;
    --info: #86A9FF;
    --info-soft: #16264A;
    --warn: #F1A552;
    --warn-soft: #3A2810;
    --crit: #FF8F86;
    --crit-soft: #40191A;
    --ok: #5ED394;
    --ok-soft: #0F3322;
    --code-bg: #070C16;
    --code-fg: #DCE6F5;
    --code-muted: #7F90AD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A111F;
  --surface: #111B2E;
  --surface-2: #18243B;
  --ink: #E7EDF7;
  --muted: #9BABC6;
  --line: #24334D;
  --line-strong: #3C4F70;
  --accent: #46C2B8;
  --accent-soft: #0F2E30;
  --info: #86A9FF;
  --info-soft: #16264A;
  --warn: #F1A552;
  --warn-soft: #3A2810;
  --crit: #FF8F86;
  --crit-soft: #40191A;
  --ok: #5ED394;
  --ok-soft: #0F3322;
  --code-bg: #070C16;
  --code-fg: #DCE6F5;
  --code-muted: #7F90AD;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.68 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
code { font: 500 0.88em var(--font-mono); background: var(--surface-2); padding: 0.08em 0.38em; border-radius: 4px; }
h1, h2, h3, h4 { text-wrap: balance; }

.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------- opening ---------- */
.opening { padding-block: 56px 36px; border-bottom: 1px solid var(--line); }
.eyebrow { font: 500 12px/1.4 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
.opening h1 { font: 500 clamp(2.4rem, 6vw, 4rem)/1.04 var(--font-display); letter-spacing: -0.015em; margin: 0 0 20px; max-width: 16ch; }
.lede { font-size: 1.1rem; max-width: 62ch; color: var(--muted); margin: 0; }
.private-tag { display: inline-block; margin-top: 22px; font: 500 12px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--muted); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 56px; padding-block: 40px 96px; }
.toc { position: sticky; top: 24px; align-self: start; font-size: 14px; line-height: 1.45; }
.toc h2 { font: 500 12px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.toc a:hover { background: var(--surface-2); }
.toc .sub a { padding-left: 22px; color: var(--muted); font-size: 13px; }
@media (max-width: 980px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .toc { position: static; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 12px; }
  .toc summary { cursor: pointer; padding: 10px 0; font: 500 13px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }
}
@media (min-width: 981px) { .toc details > summary { display: none; } .toc details { display: block; } }
@media (max-width: 980px) { .toc h2 { display: none; } }

main { min-width: 0; }
section { padding-top: 44px; }
section:first-child { padding-top: 0; }
h2.part { font: 500 clamp(1.8rem, 3.6vw, 2.5rem)/1.12 var(--font-display); letter-spacing: -0.01em; margin: 0 0 8px; }
.part-sub { color: var(--muted); margin: 0 0 24px; max-width: 62ch; }
h3 { font: 600 1.18rem/1.3 var(--font-body); margin: 40px 0 6px; }
h3 .tag { font: 500 11px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 6px; }
h4 { font: 600 0.82rem/1.3 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 24px 0 6px; }
p { margin: 0 0 16px; max-width: 68ch; }
ul, ol { max-width: 68ch; padding-left: 1.3em; margin: 0 0 16px; }
li { margin-bottom: 6px; }

.t { color: inherit; text-decoration: underline dotted var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.t:hover { color: var(--accent); }

/* ---------- tables ---------- */
.table-scroll { overflow-x: auto; margin: 18px 0 24px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.5; min-width: 560px; }
th, td { text-align: left; padding: 11px 14px; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font: 500 11.5px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { font-variant-numeric: tabular-nums; }
td code { white-space: nowrap; }

.pill { display: inline-block; font: 500 12px/1 var(--font-mono); padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.wait { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.mute { background: var(--surface-2); color: var(--muted); }

/* ---------- notes ---------- */
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin: 22px 0; max-width: 68ch; }
.note .label { display: block; font: 500 11.5px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.note p:last-child { margin-bottom: 0; }
.note.warn { background: var(--warn-soft); border-color: transparent; }
.note.warn .label { color: var(--warn); }
.note.good { background: var(--ok-soft); border-color: transparent; }
.note.good .label { color: var(--ok); }
.note.crit { background: var(--crit-soft); border-color: transparent; }
.note.crit .label { color: var(--crit); }

.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 20px 0 24px; }
.split > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.split h4 { margin-top: 0; }
.split p:last-child { margin-bottom: 0; }
@media (max-width: 720px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* ---------- code ---------- */
.codeblock { margin: 20px 0 26px; border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.codeblock .file { font: 500 12px var(--font-mono); color: var(--code-muted); padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); letter-spacing: 0.02em; }
.codeblock pre { margin: 0; padding: 14px 0; overflow-x: auto; white-space: normal; color: var(--code-fg); font: 400 13px/1.6 var(--font-mono); }
.codeblock .l { display: block; white-space: pre; padding: 0 16px; min-width: max-content; }
.codeblock .l.add { background: var(--add-bg); }
.codeblock .l.del { background: var(--del-bg); }
.codeblock .c { color: var(--code-muted); }
.codeblock .k { color: #8FB8FF; }
.codeblock .s { color: #A5E3B4; }

/* ---------- figures ---------- */
figure.diagram { margin: 26px 0 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; overflow-x: auto; }
figure.diagram svg { display: block; width: 100%; min-width: 660px; height: auto; max-width: 100%; color: var(--ink); }
figure.diagram figcaption { margin-top: 12px; font-size: 14px; color: var(--muted); max-width: 78ch; line-height: 1.55; }
figure.diagram figcaption strong { color: var(--ink); font-weight: 600; }
svg text { font-family: var(--font-body); fill: currentColor; }
.d-line { stroke: currentColor; stroke-width: 1.6; fill: none; }
.d-faint { stroke: var(--line-strong); stroke-width: 1; fill: none; }
.d-dash { stroke-dasharray: 5 4; }
.d-box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.3; }
.d-key { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.d-ghost { fill: none; stroke: var(--line-strong); stroke-width: 1.2; stroke-dasharray: 4 4; }
.d-bad { fill: var(--crit-soft); stroke: var(--crit); stroke-width: 1.4; }
.d-good { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.4; }
.d-warnbox { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.4; }
.d-band { fill: var(--surface-2); stroke: none; }
.d-t { font-size: 13px; font-weight: 600; }
.d-s { font-size: 11.5px; fill: var(--muted); }
.d-m { font-family: var(--font-mono); font-size: 11px; }
.d-h { font-size: 14px; font-weight: 600; }
.d-crit-t { fill: var(--crit); }
.d-ok-t { fill: var(--ok); }
.d-acc-t { fill: var(--accent); }
.d-badge { fill: var(--accent); }
.d-badge-t { fill: var(--bg); font-size: 11px; font-weight: 600; }
.d-bar-bad { fill: var(--crit); opacity: 0.85; }
.d-bar-good { fill: var(--accent); }
.d-sq-bad { fill: var(--crit); opacity: 0.8; }
.d-sq-faint { fill: var(--line-strong); opacity: 0.55; }
.d-sq-on { fill: var(--accent); }
.d-p1 { fill: var(--accent); }
.d-p2 { fill: var(--info); }
.d-p3 { fill: var(--warn); }

/* ---------- tl;dr for dummies ---------- */
section.tldr { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 28px 12px; }
.tldr h2.part { margin-bottom: 6px; }
.tldr .part-sub { margin-bottom: 14px; }
ul.tldr-list { list-style: none; padding: 0; margin: 20px 0 12px; max-width: none; display: grid; gap: 14px; }
.tldr-item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.tldr-item .title { grid-column: 1 / -1; padding: 10px 16px; font-weight: 600; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tldr-item .was, .tldr-item .now { padding: 14px 16px; min-width: 0; }
.tldr-item .was { background: var(--crit-soft); }
.tldr-item .now { background: var(--ok-soft); }
.tldr-item h4 { margin: 0 0 4px; }
.tldr-item .was h4 { color: var(--crit); }
.tldr-item .now h4 { color: var(--ok); }
.tldr-item p { margin: 0; max-width: none; font-size: 15px; line-height: 1.55; }
.tldr-close { margin: 4px 0 18px; }
@media (max-width: 720px) { section.tldr { padding: 20px 16px 8px; } .tldr-item { grid-template-columns: minmax(0, 1fr); } }

/* ---------- footer ---------- */
.endnote { border-top: 1px solid var(--line); padding-block: 28px 56px; color: var(--muted); font-size: 14px; }
.endnote p { max-width: 80ch; }

/* ---------- glossary ---------- */
.gloss { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }
.gloss dt { font: 600 15px var(--font-body); margin-top: 18px; scroll-margin-top: 16px; }
.gloss dt:target { background: var(--accent-soft); border-radius: 6px; padding-inline: 6px; margin-inline: -6px; }
.gloss dd { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
.gloss-group { font: 500 12px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--line); padding: 0 0 6px; margin: 36px 0 0; }
@media (max-width: 820px) { .gloss { grid-template-columns: minmax(0, 1fr); } }
.back { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

<header class="opening">
  <p class="eyebrow">{{EYEBROW}}</p>
  <h1>{{H1}}</h1>
  <p class="lede">{{LEDE}}</p>
  <span class="private-tag">{{PRIVATE_TAG}}</span>
</header>

<div class="shell">

<nav class="toc" aria-label="Contents">
  <details open>
    <summary>Contents</summary>
    <h2>Contents</h2>
    <ol>
{{TOC}}
    </ol>
  </details>
</nav>

<main>
{{BODY}}
</main>
</div>

<footer class="endnote">
  <p>{{FOOTER}}</p>
</footer>

</div>
</body>
</html>
